<!-- احذف كل المحتوى الحالي والصق هذا -->
<div class="min-h-screen bg-gray-50 p-8">
  <!-- Header -->
  <header class="mb-8">
    <h1 class="text-4xl font-bold text-blue-600 mb-2">
      New Project For Work
    </h1>
    <p class="text-gray-600">
      Angular + Tailwind CSS + .NET API
    </p>
  </header>

  <!-- Main Content -->
  <main>
    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
      <h2 class="text-2xl font-semibold text-gray-800 mb-4">
        🚀 Project Setup Complete!
      </h2>
      
      <div class="space-y-3">
        <div class="flex items-center">
          <div class="w-3 h-3 bg-green-500 rounded-full mr-3"></div>
          <span>✅ Angular Project Created</span>
        </div>
        <div class="flex items-center">
          <div class="w-3 h-3 bg-green-500 rounded-full mr-3"></div>
          <span>✅ Tailwind CSS Installed</span>
        </div>
        <div class="flex items-center">
          <div class="w-3 h-3 bg-green-500 rounded-full mr-3"></div>
          <span>✅ Git Initialized</span>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <button class="px-4 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
        Angular Docs
      </button>
      <button class="px-4 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition">
        Tailwind Docs
      </button>
      <button class="px-4 py-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition">
        .NET API Docs
      </button>
    </div>

    <!-- Counter Test -->
    <div class="bg-gray-100 rounded-lg p-6">
      <h3 class="text-xl font-medium text-gray-700 mb-4">
        Test Counter (Angular + Tailwind)
      </h3>
      <div class="flex items-center space-x-4">
        <button 
          class="px-5 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600"
          (click)="count.set(count() - 1)"
        >
          -
        </button>
        
        <span class="text-3xl font-bold text-gray-800">
          {{ count() }}
        </span>
        
        <button 
          class="px-5 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600"
          (click)="count.set(count() + 1)"
        >
          +
        </button>
      </div>
      <p class="mt-4 text-gray-600 text-sm">
        Count is: <span class="font-semibold">{{ count() }}</span>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-8 pt-6 border-t border-gray-200">
    <p class="text-gray-500 text-center">
      Ready to connect with .NET API backend
    </p>
  </footer>
</div>
